upstream api {
    server api:5000;
    keepalive 64;
}

# HSTS only means something over HTTPS: send it there, and nothing (an empty value is omitted) over plain HTTP.
map $scheme $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Plain HTTP (port 80 in the container, 8080 on the host): convenient for local use and for the QA tools on the internal network.
# In production publish only the HTTPS port below.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/locations.conf;
}

# HTTPS (port 443 in the container, 8443 on the host): TLS 1.3 ONLY (PRJ-SR-001). A client that offers only TLS 1.2 or older
# cannot connect. The self-signed certificate is created on first start (docker-entrypoint.d); mount a real one at
# /etc/nginx/certs/{cert,key}.pem in production.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/locations.conf;
}
