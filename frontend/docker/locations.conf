# Shared by the HTTP and HTTPS server blocks (nginx.conf).

# Hashed build assets never change: cache for a year.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# REST API -> Flask. The edge owns the security headers: the app's copies are dropped and one API-specific set is
# added, so every response (including error pages nginx or gunicorn generate) carries exactly one of each.
# X-Forwarded-* lets the app see the real client IP (rate limiting) and scheme (Secure cookie, HTTPS redirect).
location /api/ {
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;
    include /etc/nginx/snippets/api-security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Cache-Control;

    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Single-page app: every other path serves index.html (the router decides).
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
